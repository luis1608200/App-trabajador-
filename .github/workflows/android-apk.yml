name: Build and verify Android
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: app-trabajador-beta-debug-key-v1
      - run: gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: App-Trabajador-Prueba-Redmi
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-build
          path: |
            app/build/reports/
            app/build/test-results/
  device-tests:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: app-trabajador-beta-debug-key-v1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            mkdir -p device-evidence
            adb pull /sdcard/Download/trabajador-evidence device-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-evidence/
